<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="100%" height="100%">
  <!-- Ciervo de los Pantanos Argentino (Blastocerus dichotomus) - Grabado Láser y Orfebrería HD -->
  <defs>
    <linearGradient id="ciervo-fur-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3128"/>
      <stop offset="45%" stop-color="#14100c"/>
      <stop offset="85%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="ciervo-antler-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede3d5"/>
      <stop offset="45%" stop-color="#baa68f"/>
      <stop offset="85%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
    <linearGradient id="ciervo-black-legs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14100c"/>
      <stop offset="35%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#0a0502"/>
    </linearGradient>
  </defs>

  <g stroke="#210e02" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Majestuosa cornamenta dicotómica del ciervo de los pantanos (cada asta bifurcada dos veces) -->
    <g fill="none" stroke="url(#ciervo-antler-grad)" stroke-width="7.5" stroke-linecap="round">
      <!-- Asta Izquierda -->
      <path d="M 270 148 C 255 110 230 75 195 62"/>
      <path d="M 230 88 C 215 50 180 32 145 38"/>
      <path d="M 215 68 C 230 42 235 15 220 5"/>
      <path d="M 180 52 C 174 30 156 18 138 24"/>
      <path d="M 252 122 C 224 105 190 106 160 124"/>

      <!-- Asta Derecha (Simétrica y abierta) -->
      <path d="M 302 148 C 317 110 342 75 377 62"/>
      <path d="M 342 88 C 357 50 392 32 427 38"/>
      <path d="M 357 68 C 342 42 337 15 352 5"/>
      <path d="M 392 52 C 398 30 416 18 434 24"/>
      <path d="M 320 122 C 348 105 382 106 412 124"/>
    </g>

    <!-- Patas en segundo plano -->
    <path d="M 205 380 L 195 515 L 216 515 L 235 390 Z" fill="url(#ciervo-black-legs)"/>
    <path d="M 345 380 L 350 515 L 371 515 L 375 390 Z" fill="url(#ciervo-black-legs)"/>

    <!-- Cuerpo esbelto y porte noble del Ciervo de los Pantanos -->
    <path d="
      M 286 142
      C 304 142 322 152 328 168
      C 338 178 354 200 354 216
      C 348 226 332 232 316 226
      C 310 256 305 296 300 322
      C 336 332 372 344 398 365
      C 418 382 422 408 412 444
      L 422 520
      L 398 520
      L 388 445
      C 378 440 365 438 355 438
      L 358 520
      L 334 520
      L 342 422
      C 306 410 264 410 234 422
      L 238 520
      L 214 520
      L 222 445
      C 210 442 198 440 188 440
      L 178 520
      L 154 520
      L 164 412
      C 152 380 148 352 162 322
      C 190 306 220 300 242 284
      C 248 238 258 190 268 152
      C 272 144 278 142 286 142 Z
    " fill="url(#ciervo-fur-grad)"/>

    <!-- Característica distintiva: Medias negras en las patas inferiores -->
    <path d="M 174 450 L 178 520 L 154 520 L 158 450 Z" fill="#170c04"/>
    <path d="M 234 450 L 238 520 L 214 520 L 218 450 Z" fill="#170c04"/>
    <path d="M 354 450 L 358 520 L 334 520 L 338 450 Z" fill="#170c04"/>
    <path d="M 418 450 L 422 520 L 398 520 L 402 450 Z" fill="#170c04"/>

    <!-- Orejas grandes y afelpadas con interior blanco brillante -->
    <!-- Oreja izquierda -->
    <path d="M 270 148 C 248 132 236 150 252 170 C 265 168 270 158 270 148 Z" fill="#733810"/>
    <path d="M 264 148 C 250 140 244 152 254 165 C 260 162 264 156 264 148 Z" fill="#ffffff" stroke="none"/>
    <!-- Oreja derecha -->
    <path d="M 302 148 C 324 132 336 150 320 170 C 307 168 302 158 302 148 Z" fill="#733810"/>
    <path d="M 308 148 C 322 140 328 152 318 165 C 312 162 308 156 308 148 Z" fill="#ffffff" stroke="none"/>

    <!-- Cabeza y rostro noble con marcas blancas faciales típicas -->
    <path d="
      M 286 148
      C 298 150 308 162 312 178
      C 318 190 342 198 344 212
      C 342 224 330 228 316 226
      C 302 222 292 205 288 192
      C 282 175 282 158 286 148 Z
    " fill="#a6551b"/>

    <!-- Marcas blancas alrededor de los ojos y hocico -->
    <ellipse cx="308" cy="180" rx="9" ry="7" fill="#ffffff" stroke="none"/>
    <ellipse cx="308" cy="180" rx="5" ry="4" fill="#170c04"/>
    <circle cx="310" cy="178" r="1.5" fill="#ffffff"/>

    <path d="M 334 205 C 342 208 346 215 344 222 C 338 226 328 226 324 220 Z" fill="#ffffff" stroke="none"/>
    <!-- Nariz negra húmeda -->
    <ellipse cx="342" cy="214" rx="4.5" ry="3.5" fill="#0d0501"/>

    <!-- Pecho y garganta con matiz blanco crema suave -->
    <path d="M 286 195 C 295 235 305 270 298 310 C 285 300 278 260 274 220 Z" fill="#fcf6ec" stroke="none" opacity="0.9"/>
  </g>
</svg>
