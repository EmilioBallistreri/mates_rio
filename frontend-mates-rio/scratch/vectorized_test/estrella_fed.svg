<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Estrella Federal Argentina de 8 Puntas - Original Vector -->
  <defs>
    <!-- Gradiente Rojo Federal Punzó -->
    <radialGradient id="estrella-punzo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b3128"/>
      <stop offset="45%" stop-color="#14100c"/>
      <stop offset="85%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#14100c"/>
    </radialGradient>
    <!-- Gradiente Dorado de Orfebrería -->
    <linearGradient id="estrella-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ded8cf"/>
      <stop offset="50%" stop-color="#14100c"/>
      <stop offset="100%" stop-color="#14100c"/>
    </linearGradient>
  </defs>

  <!-- Puntas de la Estrella de 8 Puntas Facetadas (4 cardinales largas + 4 diagonales) -->
  <g stroke="#14100c" stroke-width="2.5" stroke-linejoin="round">
    <!-- Punta Norte (0°) -->
    <polygon points="250,25 250,250 205,180" fill="#14100c"/>
    <polygon points="250,25 250,250 295,180" fill="#14100c"/>

    <!-- Punta Sur (180°) -->
    <polygon points="250,475 250,250 295,320" fill="#14100c"/>
    <polygon points="250,475 250,250 205,320" fill="#14100c"/>

    <!-- Punta Este (90°) -->
    <polygon points="475,250 250,250 320,205" fill="#14100c"/>
    <polygon points="475,250 250,250 320,295" fill="#14100c"/>

    <!-- Punta Oeste (270°) -->
    <polygon points="25,250 250,250 180,295" fill="#14100c"/>
    <polygon points="25,250 250,250 180,205" fill="#14100c"/>

    <!-- Punta Nor-Este (45°) -->
    <polygon points="410,90 250,250 320,205" fill="#14100c"/>
    <polygon points="410,90 250,250 295,180" fill="#3b3128"/>

    <!-- Punta Nor-Oeste (315°) -->
    <polygon points="90,90 250,250 205,180" fill="#14100c"/>
    <polygon points="90,90 250,250 180,205" fill="#3b3128"/>

    <!-- Punta Sur-Este (135°) -->
    <polygon points="410,410 250,250 295,320" fill="#14100c"/>
    <polygon points="410,410 250,250 320,295" fill="#3b3128"/>

    <!-- Punta Sur-Oeste (225°) -->
    <polygon points="90,410 250,250 180,295" fill="#14100c"/>
    <polygon points="90,410 250,250 205,320" fill="#3b3128"/>
  </g>

  <!-- Borde exterior de orfebrería dorada / cincelado -->
  <polygon points="
    250,25 295,180 410,90 320,205 
    475,250 320,295 410,410 295,320 
    250,475 205,320 90,410 180,295 
    25,250 180,205 90,90 205,180
  " fill="none" stroke="url(#estrella-gold)" stroke-width="4.5"/>

  <!-- Medallón Central de Platería Criolla -->
  <!-- Aro exterior perlado de oro -->
  <circle cx="250" cy="250" r="58" fill="url(#estrella-gold)" stroke="#14100c" stroke-width="3"/>
  
  <!-- Perlas cinceladas -->
  <g fill="#ffffff" stroke="#14100c" stroke-width="1.2">
    <circle cx="250" cy="198" r="4"/><circle cx="287" cy="213" r="4"/><circle cx="302" cy="250" r="4"/>
    <circle cx="287" cy="287" r="4"/><circle cx="250" cy="302" r="4"/><circle cx="213" cy="287" r="4"/>
    <circle cx="198" cy="250" r="4"/><circle cx="213" cy="213" r="4"/>
  </g>

  <!-- Corazón de rubí / esmalte rojo federal -->
  <circle cx="250" cy="250" r="42" fill="url(#estrella-punzo)" stroke="#ffffff" stroke-width="2.5"/>
  
  <!-- Flor / Sol de Mayo cincelado en el centro -->
  <circle cx="250" cy="250" r="18" fill="url(#estrella-gold)" stroke="#14100c" stroke-width="2"/>
  <circle cx="250" cy="250" r="7" fill="#ffffff"/>
</svg>
