<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="100%" height="100%">
  <!-- Top and Bottom framing lines -->
  <line x1="0" y1="5" x2="160" y2="5" stroke="currentColor" stroke-width="2.5" />
  <line x1="0" y1="45" x2="160" y2="45" stroke="currentColor" stroke-width="2.5" />
  
  <!-- Left Stepped Unit -->
  <g transform="translate(15, 25)">
    <polygon points="0,-16 4,-12 4,-8 8,-4 8,0 4,4 4,8 0,12 -4,8 -4,4 -8,0 -8,-4 -4,-8 -4,-12" fill="none" stroke="currentColor" stroke-width="2.5" />
    <polygon points="0,-6 4,0 0,6 -4,0" fill="currentColor" />
  </g>

  <!-- Center Stepped Cruz Pampa (Major) -->
  <g transform="translate(80, 25)">
    <!-- Outer stepped border -->
    <path d="M 0,-18 L 5,-13 L 5,-9 L 10,-5 L 10,-1 L 15,0 L 10,1 L 10,5 L 5,9 L 5,13 L 0,18 L -5,13 L -5,9 L -10,5 L -10,1 L -15,0 L -10,-1 L -10,-5 L -5,-9 L -5,-13 Z" fill="none" stroke="currentColor" stroke-width="2.8" />
    <!-- Inner stepped diamond -->
    <path d="M 0,-11 L 3,-8 L 3,-5 L 6,-2 L 6,0 L 3,2 L 3,5 L 0,8 L -3,5 L -3,2 L -6,0 L -6,-2 L -3,-5 L -3,-8 Z" fill="none" stroke="currentColor" stroke-width="2" />
    <!-- Solid central rhombus -->
    <polygon points="0,-4 3.5,0 0,4 -3.5,0" fill="currentColor" />
  </g>

  <!-- Right Stepped Unit -->
  <g transform="translate(145, 25)">
    <polygon points="0,-16 4,-12 4,-8 8,-4 8,0 4,4 4,8 0,12 -4,8 -4,4 -8,0 -8,-4 -4,-8 -4,-12" fill="none" stroke="currentColor" stroke-width="2.5" />
    <polygon points="0,-6 4,0 0,6 -4,0" fill="currentColor" />
  </g>

  <!-- Intermediate stepped connects -->
  <g transform="translate(48, 25)">
    <polygon points="0,-10 6,0 0,10 -6,0" fill="none" stroke="currentColor" stroke-width="2" />
    <polygon points="0,-4 2.5,0 0,4 -2.5,0" fill="currentColor" />
  </g>
  <g transform="translate(112, 25)">
    <polygon points="0,-10 6,0 0,10 -6,0" fill="none" stroke="currentColor" stroke-width="2" />
    <polygon points="0,-4 2.5,0 0,4 -2.5,0" fill="currentColor" />
  </g>
</svg>