<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <!-- Cóndor Andino - Original Vector Silhouette -->
  <!-- Silueta soberbia en vuelo majestuoso con alas extendidas -->
  <g fill="#1a1410" stroke="#000000" stroke-width="1.5" stroke-linejoin="round">
    <!-- Ala Izquierda con remeras primarias desplegadas -->
    <path d="M 290 220 
             C 240 180 180 120 100 80 
             C 65 65 30 60 10 70 
             C 25 85 45 95 65 110 
             C 45 115 25 125 15 140 
             C 35 145 60 150 80 160 
             C 60 170 35 185 25 205 
             C 50 205 75 205 95 215 
             C 75 228 50 245 40 265 
             C 65 260 90 255 115 255 
             C 95 275 75 295 65 315 
             C 95 305 125 295 155 285 
             C 185 275 220 270 255 260 
             C 275 255 285 245 290 220 Z"/>

    <!-- Ala Derecha con remeras primarias desplegadas (simetría natural) -->
    <path d="M 310 220 
             C 360 180 420 120 500 80 
             C 535 65 570 60 590 70 
             C 575 85 555 95 535 110 
             C 555 115 575 125 585 140 
             C 565 145 540 150 520 160 
             C 540 170 565 185 575 205 
             C 550 205 525 205 505 215 
             C 525 228 550 245 560 265 
             C 535 260 510 255 485 255 
             C 505 275 525 295 535 315 
             C 505 305 475 295 445 285 
             C 415 275 380 270 345 260 
             C 325 255 315 245 310 220 Z"/>

    <!-- Cola en abanico -->
    <path d="M 280 260 L 260 380 L 285 390 L 300 395 L 315 390 L 340 380 L 320 260 Z"/>

    <!-- Cuerpo y torso -->
    <path d="M 280 210 C 275 240 280 270 300 270 C 320 270 325 240 320 210 Z"/>

    <!-- Cabeza y Cuello erguido -->
    <path d="M 285 180 C 285 150 295 120 300 110 C 305 120 315 150 315 180 Z"/>

    <!-- Cabeza de perfil con cresta carúncula y pico ganchudo -->
    <path d="M 292 140 
             C 292 115 300 100 310 95 
             C 320 92 328 100 330 110 
             C 338 115 348 122 345 130 
             C 338 135 330 132 325 135 
             C 325 145 315 155 305 155 Z"/>
  </g>

  <!-- Collar blanco de plumón característico del cóndor (Ruff) -->
  <path d="M 282 175 C 290 190 310 190 318 175 C 315 168 285 168 282 175 Z" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>

  <!-- Franjas alares blancas superiores (típicas del cóndor andino adulto) -->
  <path d="M 180 150 C 220 180 260 210 275 215 C 265 230 220 205 170 170 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 420 150 C 380 180 340 210 325 215 C 335 230 380 205 430 170 Z" fill="#ffffff" opacity="0.9"/>
</svg>
