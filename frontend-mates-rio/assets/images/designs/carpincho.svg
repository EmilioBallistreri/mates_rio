<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="100%" height="100%">
  <!-- Carpincho / Capibara Criollo - Original Vector -->
  <defs>
    <linearGradient id="carpincho-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80532d"/>
      <stop offset="50%" stop-color="#593416"/>
      <stop offset="100%" stop-color="#301908"/>
    </linearGradient>
  </defs>

  <!-- Silueta noble del carpincho con perfil característico -->
  <g fill="url(#carpincho-grad)" stroke="#1a0c03" stroke-width="3" stroke-linejoin="round">
    <!-- Cuerpo robusto, lomo redondeado, hocico romo cuadrangular -->
    <path d="
      M 430 180
      C 450 185 470 200 480 220
      C 485 235 480 255 465 260
      C 450 265 425 260 410 255
      C 390 270 380 290 385 330
      L 385 365
      L 355 365
      L 355 330
      C 345 320 330 315 315 315
      L 305 365
      L 275 365
      L 280 310
      C 250 310 220 310 190 315
      L 185 365
      L 155 365
      L 160 325
      C 150 325 140 330 135 345
      L 125 365
      L 95 365
      L 100 325
      C 80 300 75 260 85 220
      C 95 180 130 145 180 130
      C 230 115 300 120 345 135
      C 375 145 395 155 410 165
      Z
    "/>

    <!-- Oreja redondeada pequeña característica -->
    <path d="M 370 145 C 370 125 385 125 390 140 C 390 155 375 160 370 145 Z" fill="#301908"/>

    <!-- Ojo tranquilo en la parte superior del hocico -->
    <ellipse cx="420" cy="190" rx="6" ry="4" fill="#0d0501"/>
    <circle cx="421" cy="189" r="1.5" fill="#ffffff"/>

    <!-- Narina en el extremo del hocico -->
    <ellipse cx="468" cy="235" rx="4" ry="7" fill="#0d0501" transform="rotate(-15, 468, 235)"/>

    <!-- Línea sutil de boca y mandíbula inferior -->
    <path d="M 470 248 C 455 255 435 252 420 250" fill="none" stroke="#1a0c03" stroke-width="2.5"/>
  </g>

  <!-- Pata delantera visible -->
  <g fill="#42250d" stroke="#1a0c03" stroke-width="2.5">
    <path d="M 360 270 L 375 365 L 345 365 L 335 270 Z"/>
    <path d="M 135 250 L 145 365 L 115 365 L 115 255 Z"/>
  </g>

  <!-- Suelo de pastizal ribereño / esteros -->
  <g stroke="#593416" stroke-width="2" stroke-linecap="round">
    <line x1="70" y1="367" x2="420" y2="367"/>
    <path d="M 90 367 Q 95 350 105 345" fill="none"/>
    <path d="M 210 367 Q 215 355 225 350" fill="none"/>
    <path d="M 390 367 Q 395 348 405 342" fill="none"/>
  </g>
</svg>
