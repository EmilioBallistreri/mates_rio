<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" width="100%" height="100%">
  <!-- Cruz Criolla Gauchesca de Platería - Original Vector -->
  <defs>
    <!-- Gradiente de Alpaca / Plata Cincelada -->
    <linearGradient id="cruz-plata-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ded7cc"/>
      <stop offset="70%" stop-color="#b5a998"/>
      <stop offset="100%" stop-color="#7a6e5e"/>
    </linearGradient>
    <radialGradient id="cruz-centro-grad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="70%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#694e09"/>
    </radialGradient>
  </defs>

  <!-- Silueta Cruz Criolla Trebolada con Cincelado Orfebre -->
  <g fill="url(#cruz-plata-grad)" stroke="#453b2f" stroke-width="4" stroke-linejoin="round">
    <path d="
      M 215 50
      C 215 25 240 10 250 10 C 260 10 285 25 285 50
      C 305 40 325 60 315 80 C 300 95 285 85 285 105
      L 285 170
      L 355 170
      C 355 150 375 135 395 150 C 415 160 415 185 395 195 C 420 205 420 230 395 240 C 375 255 355 240 355 220
      L 285 220
      L 285 450
      C 300 450 315 470 305 490 C 290 515 270 510 250 540 C 230 510 210 515 195 490 C 185 470 200 450 215 450
      L 215 220
      L 145 220
      C 145 240 125 255 105 240 C 80 230 80 205 105 195 C 85 185 85 160 105 150 C 125 135 145 150 145 170
      L 215 170
      L 215 105
      C 215 85 200 95 185 80 C 175 60 195 40 215 50 Z
    "/>
  </g>

  <!-- Detalles de Cincelado y Filete Interior -->
  <g fill="none" stroke="#2b231b" stroke-width="2.2" opacity="0.85">
    <!-- Línea cruciforme central cincelada -->
    <line x1="250" y1="50" x2="250" y2="480"/>
    <line x1="125" y1="195" x2="375" y2="195"/>

    <!-- Flores treboladas cinceladas en cada extremo -->
    <!-- Extremo Superior -->
    <circle cx="250" cy="55" r="9"/>
    <!-- Extremo Inferior -->
    <circle cx="250" cy="475" r="11"/>
    <!-- Extremo Izquierdo -->
    <circle cx="125" cy="195" r="9"/>
    <!-- Extremo Derecho -->
    <circle cx="375" cy="195" r="9"/>
  </g>

  <!-- Rayos / Resplandor Criollo Orfebre en los cuatro cuadrantes -->
  <g stroke="#917c66" stroke-width="2.5" stroke-linecap="round">
    <line x1="225" y1="170" x2="200" y2="145"/>
    <line x1="275" y1="170" x2="300" y2="145"/>
    <line x1="225" y1="220" x2="200" y2="245"/>
    <line x1="275" y1="220" x2="300" y2="245"/>
  </g>

  <!-- Medallón Central Dorado con Flor del Ceibo / Sol de Mayo cincelado -->
  <circle cx="250" cy="195" r="32" fill="url(#cruz-centro-grad)" stroke="#4a3707" stroke-width="3"/>
  <circle cx="250" cy="195" r="26" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2,3"/>
  <circle cx="250" cy="195" r="14" fill="#ffffff" stroke="#c59b27" stroke-width="2"/>
  <circle cx="250" cy="195" r="5" fill="#4a3707"/>
</svg>
