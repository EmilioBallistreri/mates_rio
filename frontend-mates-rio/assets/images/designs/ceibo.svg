<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Flor Nacional del Ceibo - Original Vector -->
  <defs>
    <linearGradient id="ceibo-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="40%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#7a0016"/>
    </linearGradient>
    <linearGradient id="ceibo-stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7c29"/>
      <stop offset="100%" stop-color="#234510"/>
    </linearGradient>
  </defs>

  <!-- Tallo y cáliz -->
  <path d="M 120 440 C 160 380 200 320 225 260 C 235 235 240 210 245 195" fill="none" stroke="url(#ceibo-stem)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Hojas del Ceibo -->
  <!-- Hoja izquierda -->
  <path d="M 160 380 C 110 375 70 330 80 290 C 110 295 140 330 160 380 Z" fill="#3a6920" stroke="#1d380f" stroke-width="2"/>
  <path d="M 160 380 Q 120 335 80 290" fill="none" stroke="#254a13" stroke-width="1.8"/>

  <!-- Hoja derecha -->
  <path d="M 205 320 C 240 310 280 325 295 365 C 265 375 225 355 205 320 Z" fill="#4a7c29" stroke="#1d380f" stroke-width="2"/>
  <path d="M 205 320 Q 250 340 295 365" fill="none" stroke="#254a13" stroke-width="1.8"/>

  <!-- Cáliz acampanado verde/rojizo -->
  <path d="M 230 215 C 235 180 245 165 260 155 C 265 170 260 200 248 225 Z" fill="#5c1d1d" stroke="#330b0b" stroke-width="2"/>

  <!-- Flor Principal del Ceibo (Pétalo Estandarte Curvo Crestado) -->
  <!-- Capa exterior carmesí profundo -->
  <path d="M 250 165 
           C 220 120 230 60 280 40 
           C 340 18 410 70 415 140 
           C 420 215 365 290 285 330 
           C 255 345 235 340 235 320 
           C 235 285 285 245 325 205 
           C 365 165 355 110 310 95 
           C 275 82 250 120 250 165 Z" 
        fill="url(#ceibo-red)" stroke="#5e0010" stroke-width="3"/>

  <!-- Alas y Quilla de la flor (pétalos interiores característicos) -->
  <path d="M 255 195 
           C 270 180 305 180 320 210 
           C 310 240 270 260 250 250 
           C 240 245 245 210 255 195 Z" 
        fill="#e61c38" stroke="#7a0016" stroke-width="2"/>

  <!-- Pétalo quilla interior curvo con estambres -->
  <path d="M 245 220 
           C 260 240 285 265 275 285 
           C 260 300 240 280 235 255 Z" 
        fill="#ff4a65" stroke="#940520" stroke-width="1.5"/>

  <!-- Estambres sutiles asomando -->
  <path d="M 260 210 Q 290 235 295 255" fill="none" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="295" cy="255" r="3" fill="#ffb700"/>

  <path d="M 258 218 Q 282 245 288 268" fill="none" stroke="#ffe066" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="288" cy="268" r="3" fill="#ffb700"/>
</svg>
