<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <!-- Símbolo de Infinito Eterno Orfebre - Original Vector -->
  <defs>
    <!-- Gradiente Metálico de Alpaca y Plata -->
    <linearGradient id="inf-metal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8a796"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#7a6b5c"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b8a796"/>
    </linearGradient>
    <!-- Gradiente de Oro / Bronce para detalles cincelados -->
    <linearGradient id="inf-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2"/>
      <stop offset="50%" stop-color="#c99b24"/>
      <stop offset="100%" stop-color="#735508"/>
    </linearGradient>
  </defs>

  <!-- Lazo Continuo de Infinito con Cinta de Moebius y relieve -->
  <!-- Cinta base / Sombra de profundidad -->
  <path d="
    M 300 175
    C 360 270 480 270 530 210
    C 580 150 540 70 450 70
    C 370 70 330 140 300 175
    C 270 210 230 280 150 280
    C 60 280 20 200 70 140
    C 120 80 240 80 300 175 Z
  " fill="none" stroke="#2b231c" stroke-width="36" stroke-linecap="round"/>

  <!-- Cinta Metálica Principal Pulida -->
  <path d="
    M 300 175
    C 360 270 480 270 530 210
    C 580 150 540 70 450 70
    C 370 70 330 140 300 175
    C 270 210 230 280 150 280
    C 60 280 20 200 70 140
    C 120 80 240 80 300 175 Z
  " fill="none" stroke="url(#inf-metal-grad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Línea central de cincelado orfebre grabada en oro -->
  <path d="
    M 300 175
    C 360 270 480 270 530 210
    C 580 150 540 70 450 70
    C 370 70 330 140 300 175
    C 270 210 230 280 150 280
    C 60 280 20 200 70 140
    C 120 80 240 80 300 175 Z
  " fill="none" stroke="url(#inf-gold-grad)" stroke-width="4" stroke-dasharray="8,5"/>

  <!-- Cruce de la cinta con sombra de solapamiento para dar efecto 3D real -->
  <path d="
    M 280 150
    C 290 162 300 175 310 188
    C 325 208 340 225 360 240
  " fill="none" stroke="url(#inf-metal-grad)" stroke-width="28" stroke-linecap="round"/>
  <path d="
    M 280 150
    C 290 162 300 175 310 188
    C 325 208 340 225 360 240
  " fill="none" stroke="url(#inf-gold-grad)" stroke-width="4" stroke-dasharray="8,5"/>

  <!-- Filetes de brillo exterior en bordes -->
  <path d="
    M 300 160
    C 360 255 480 255 525 200
  " fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="
    M 300 190
    C 240 295 120 295 75 220
  " fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
</svg>
